name: Bug report
description: Report a reproducible defect in the public project
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a reproducible problem. Do not attach ROMs, save states or proprietary dumps."
  - type: input
    id: revision
    attributes:
      label: Revision / build
      placeholder: commit SHA or build identifier
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: Minimal sequence that reproduces the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots
      description: Remove private data and do not attach copyrighted ROM material.
