<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DBZ LSW Fangame</title>
  <desc id="desc">Public development preview banner for the research-driven Legendary Super Warriors fangame project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.58" stop-color="#12182b"/><stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#fb7185"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="135" r="145" fill="#f59e0b" opacity=".12" filter="url(#glow)"/>
  <circle cx="1040" cy="470" r="185" fill="#22d3ee" opacity=".1" filter="url(#glow)"/>
  <rect x="70" y="74" width="224" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/>
  <text x="182" y="97" text-anchor="middle" fill="#fbbf24" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">PUBLIC DEVELOPMENT PREVIEW</text>
  <text x="70" y="205" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="-2">DBZ LSW</text>
  <text x="70" y="281" fill="url(#accent)" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="-2">FANGAME</text>
  <text x="73" y="337" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Research-driven community recreation of</text>
  <text x="73" y="372" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Dragon Ball Z: Legendary Super Warriors (GBC)</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#dbeafe">
    <rect x="72" y="421" width="174" height="40" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#60a5fa" stroke-opacity=".35"/><text x="159" y="446" text-anchor="middle">GBC-TIMED COMBAT</text>
    <rect x="260" y="421" width="192" height="40" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#f59e0b" stroke-opacity=".35"/><text x="356" y="446" text-anchor="middle">DETERMINISTIC ENGINE</text>
    <rect x="466" y="421" width="194" height="40" rx="8" fill="#ffffff" fill-opacity=".055" stroke="#22d3ee" stroke-opacity=".35"/><text x="563" y="446" text-anchor="middle">ROM-BACKED FIDELITY</text>
  </g>
  <g transform="translate(835 120)">
    <rect x="50" y="40" width="255" height="340" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2" transform="rotate(8 178 210)"/>
    <rect x="22" y="28" width="255" height="340" rx="22" fill="#111827" stroke="#475569" stroke-width="2" transform="rotate(-5 150 198)"/>
    <rect x="0" y="20" width="255" height="340" rx="22" fill="#151c2e" stroke="#64748b" stroke-width="2"/>
    <rect x="25" y="52" width="205" height="128" rx="12" fill="#0b1020" stroke="#334155"/>
    <path d="M43 144L82 113l31 17 37-58 57 86" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="25" y="218" fill="#94a3b8" font-family="monospace" font-size="13">TICK 084</text>
    <text x="25" y="247" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">ACTION TIMELINE</text>
    <line x1="27" y1="282" x2="222" y2="282" stroke="#334155" stroke-width="4"/>
    <circle cx="70" cy="282" r="8" fill="#f59e0b"/><circle cx="133" cy="282" r="8" fill="#fb7185"/><circle cx="198" cy="282" r="8" fill="#22d3ee"/>
    <text x="25" y="326" fill="#94a3b8" font-family="monospace" font-size="13">SHOT → MOTION → IMPACT</text>
  </g>
  <rect x="0" y="578" width="1280" height="62" fill="#070a12" fill-opacity=".72"/>
  <text x="72" y="616" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="17">github.com/smouj/dbzlsw-fangame</text>
  <text x="1208" y="616" text-anchor="end" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="17">r/DBZ_LSW_FANGAME</text>
</svg>
